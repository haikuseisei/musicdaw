<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DAW - Phase 0 Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>AI DAW <span class="badge">Phase 0</span></h1>
    <div id="transport">
      <button id="btn-record" class="transport-btn" title="Recording">&#9679; REC</button>
      <button id="btn-play" class="transport-btn" disabled title="Play">&#9654; PLAY</button>
      <button id="btn-stop" class="transport-btn" disabled title="Stop">&#9632; STOP</button>
      <label class="bpm-control">
        BPM
        <input id="bpm" type="number" value="120" min="60" max="200" step="1">
      </label>
      <span id="time-display">0:00</span>
    </div>
  </header>

  <main>
    <section class="track" id="track-recording">
      <div class="track-header">
        <span class="track-icon">&#127928;</span>
        <span class="track-name">Recording</span>
        <input type="range" class="vol-slider" id="vol-recording" min="0" max="1" step="0.01" value="0.8">
      </div>
      <div class="track-lane">
        <canvas id="waveform-recording"></canvas>
        <div id="recording-placeholder" class="placeholder">Click REC to start recording</div>
      </div>
    </section>

    <section class="track" id="track-chords">
      <div class="track-header">
        <span class="track-icon">&#9835;</span>
        <span class="track-name">Chords</span>
      </div>
      <div class="track-lane">
        <canvas id="chord-display"></canvas>
        <div id="chords-placeholder" class="placeholder">Analyze recording to detect chords</div>
      </div>
    </section>

    <section class="track" id="track-drums">
      <div class="track-header">
        <span class="track-icon">&#129345;</span>
        <span class="track-name">Drums</span>
        <input type="range" class="vol-slider" id="vol-drums" min="0" max="1" step="0.01" value="0.7">
      </div>
      <div class="track-lane">
        <canvas id="drum-display"></canvas>
        <div id="drums-placeholder" class="placeholder">Generate drums after chord detection</div>
      </div>
    </section>

    <section id="actions">
      <button id="btn-analyze" class="action-btn" disabled>Analyze Chords</button>
      <button id="btn-generate-drums" class="action-btn" disabled>Generate Drums</button>
      <select id="drum-style">
        <option value="rock">Rock</option>
        <option value="pop">Pop</option>
        <option value="ballad">Ballad</option>
        <option value="funk">Funk</option>
      </select>
    </section>

    <section id="status-bar">
      <span id="status-message">Ready</span>
    </section>
  </main>

  <script src="js/audio-engine.js"></script>
  <script src="js/chord-detector.js"></script>
  <script src="js/drum-machine.js"></script>
  <script src="js/waveform-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
